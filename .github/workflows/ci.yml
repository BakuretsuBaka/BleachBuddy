name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check the scripts parse
        run: for f in background.js content.js options.js popup.js blocked.js; do node --check $f; done
      - name: Lint for Firefox
        run: npx --yes web-ext lint --source-dir . --ignore-files "tests/**" "package.json" ".github/**" "README.md"
