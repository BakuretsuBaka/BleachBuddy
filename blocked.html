<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site blocked</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <main>
    <h1><img src="icons/icon-48.png" width="40" height="40" alt="" style="vertical-align:-10px;margin-right:8px">Site blocked</h1>
    <p>BleachBuddy blocked <strong id="host">this site</strong> because it belongs to a filter list you have switched on.</p>
    <p class="muted">To open it anyway, switch off the matching list (or just this site) in the settings.</p>
    <div class="buttons">
      <button id="back">Go back</button>
      <button id="settings" class="primary">Open settings</button>
    </div>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
